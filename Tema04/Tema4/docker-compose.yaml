services:
  mysql:
    image: mysql:8.4
    container_name: mysql_tema4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: AD
      MYSQL_USER: paula
      MYSQL_PASSWORD: paula123
    ports:
      - "3307:3306"
    volumes:
      - mysql_tema4_data:/var/lib/mysql

volumes:
  mysql_tema4_data: